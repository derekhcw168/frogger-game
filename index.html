<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>青蛙過街 2：3D 跨越冒險 (Frogger 3D Odyssey)</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入 Three.js WebGL 3D 引擎 (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- 3D 畫布容器 -->
    <div id="gameContainer"></div>

    <!-- 頂部現代毛玻璃 HUD 資訊列 -->
    <header class="top-hud">
        <div class="hud-pill">
            <button class="world-badge" id="worldSelectBtn">🗺️ <span id="hudWorld">世界 1：花園小溪</span> ▾</button>
            <div class="rescue-tracker">
                <span>拯救小萌蛙:</span>
                <div id="hudBabyIcons"></div>
            </div>
        </div>

        <div class="hud-pill">
            <div class="stats-group">
                <div class="stat-item">🪙 金幣: <span id="hudCoins">0</span></div>
                <div class="stat-item">⭐ 分數: <span id="hudScore">0</span></div>
                <div class="stat-item">🏆 最高: <span id="hudHighScore">5000</span></div>
                <div class="stat-item">生命: <span id="hudLives">🐸🐸🐸</span></div>
            </div>
        </div>
    </header>

    <!-- 操作漂浮提示 -->
    <div class="floating-tip">
        [↑↓←→ / WASD] 跳躍 | [空白鍵] 超級大跳 | [E] 伸長舌頭 | [Q] 蛙鳴尋找小青蛙
    </div>

    <!-- 底部動作與超能力技能列 (Action Dock) -->
    <footer class="bottom-dock">
        <button class="skill-btn special" id="btnSuperHop" aria-label="超級大跳">
            <span class="icon">🚀</span>
            <span class="label">超級大跳</span>
            <span class="hotkey">空白鍵 / J</span>
        </button>

        <button class="skill-btn" id="btnTongue" aria-label="長舌抓捕">
            <span class="icon">👅</span>
            <span class="label">長舌抓捕</span>
            <span class="hotkey">E 鍵 / K</span>
        </button>

        <button class="skill-btn" id="btnCroak" aria-label="超能蛙鳴">
            <span class="icon">📢</span>
            <span class="label">超能蛙鳴</span>
            <span class="hotkey">Q 鍵 / L</span>
        </button>
    </footer>

    <!-- 右下角快捷工具列 -->
    <aside class="quick-tools">
        <button class="tool-icon-btn" id="muteBtn" title="音效開關">🔊</button>
        <button class="tool-icon-btn" id="fullscreenBtn" title="全螢幕">⛶</button>
    </aside>

    <!-- 遊戲腳本 -->
    <script src="audio.js"></script>
    <script src="models3d.js"></script>
    <script src="game3d.js"></script>

    <script>
        // 音效開關
        const muteBtn = document.getElementById('muteBtn');
        muteBtn.addEventListener('click', () => {
            window.soundEngine.init();
            const isMuted = window.soundEngine.toggleMute();
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
        });

        // 全螢幕切換
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
                fullscreenBtn.textContent = '✖';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fullscreenBtn.textContent = '⛶';
                }
            }
        });

        // 首次點擊或按鍵啟用聲音引擎
        window.addEventListener('click', () => {
            if (window.soundEngine) {
                window.soundEngine.init();
                window.soundEngine.startBGM();
            }
        }, { once: true });
    </script>
</body>
</html>
